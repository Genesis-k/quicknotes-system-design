<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>

  <header>
    <h1>QuickNotes System Client</h1>
    <p class="tagline">Enterprise REST API integration and testing client</p>
  </header>

  <main>
    <!-- Section 1: Create Note -->
    <section class="card">
      <h2>Create a Note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Note Title *</label>
          <input type="text" id="title-input" placeholder="Enter title (max 100 characters)...">
        </div>

        <div class="form-group">
          <label for="body-input">Note Content</label>
          <textarea id="body-input" rows="4" placeholder="Enter note body (optional)..."></textarea>
        </div>

        <button type="submit" id="submit-btn">Create Note</button>
      </form>
    </section>

    <!-- Section 2: Notes Explorer -->
    <section class="card">
      <div class="section-header">
        <h2>Server Notes</h2>
        <button type="button" id="load-btn">Load Notes</button>
      </div>

      <p id="status" class="status-box" role="status"></p>

      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes Inc. Distributed Systems Architecture & Client.</p>
  </footer>

</body>
</html>
